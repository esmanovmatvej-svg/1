name: Update schedule

on:
  schedule:
    # 03:00 UTC = 06:00 MSK (Novosibirsk is UTC+7, so ~10:00 local).
    # Adjust the hour if you want it to run at a different local time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  scrape:
    # Runs on YOUR own computer (a self-hosted runner), not GitHub's cloud
    # servers - the target site blocks GitHub's/Azure's known datacenter IP
    # ranges as "VPN/proxy traffic", so the job has to come from a normal
    # residential IP instead. See README.md for how to set the runner up.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer and stealth plugin
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run scraper
        env:
          SUPABASE_URL: "https://wsrrqwvemfliwzsqlkvg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUCAPTCHA_KEY: ${{ secrets.RUCAPTCHA_KEY }}
          TIMETABLE_GROUP_NAME: "128"
        run: node scripts/scrape-schedule.js

      - name: Upload debug page on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug-page.html
          retention-days: 7
