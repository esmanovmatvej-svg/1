<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Домашка — Владелец</title>
<link rel="manifest" href="manifest-owner.json">
<meta name="theme-color" content="#26784B">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Домашка · Владелец">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{
  /* Домашка design system — owner theme (см. артефакт "Домашка — Design System") */
  --bg:#F6FAF7; --bg-elevated:#FFFFFF;
  --surface:#FFFFFF; --surface-solid:#FFFFFF;
  --border:#E6EEE9;
  --text-primary:#13261F; --text-secondary:#5B7568;
  --accent:#26784B; --accent-contrast:#FFFFFF; --accent-soft:#26784B17;
  --success:#1E9E5A; --warn:#C9922B; --danger:#C43A3F;
  --shadow:0 8px 24px rgba(19,38,31,.08);
  --radius-sm:8px; --radius-md:16px; --radius-lg:26px; --radius-pill:999px;
  --font-display:"Unbounded", system-ui, sans-serif;
  --font-body:"Golos Text", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-body);background:var(--bg);color:var(--text-primary);
  min-height:100vh;line-height:1.4;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}

header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.greeting .hello{font-size:.86rem;color:var(--text-secondary)}
.greeting .name{font-family:var(--font-display);font-size:1.25rem;font-weight:600}
.header-icon{
  width:40px;height:40px;border-radius:var(--radius-pill);background:var(--surface);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1.05rem;cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,var(--accent),#1D5C39);
  border-radius:var(--radius-lg);padding:22px 20px;color:#fff;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 14px 30px rgba(38,120,75,.28);
}
.hero .label{display:flex;align-items:center;gap:6px;font-size:.78rem;opacity:.85;margin-bottom:6px}
.hero h2{font-family:var(--font-display);font-size:1.1rem;font-weight:600;line-height:1.3;max-width:170px}
.ring-wrap{position:relative;width:92px;height:92px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring-num b{font-size:1.3rem;font-weight:700}
.ring-num span{font-size:.62rem;opacity:.85}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 16px;box-shadow:var(--shadow);
}
.stat-card .icon{
  width:34px;height:34px;border-radius:var(--radius-pill);background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:10px;
}
.stat-card .num{font-family:var(--font-display);font-size:1.5rem;font-weight:600}
.stat-card .cap{font-size:.78rem;color:var(--text-secondary);margin-top:2px}

.section-title{font-size:1.02rem;font-weight:600;margin:22px 0 10px;font-family:var(--font-display)}

.student-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);
}
.student-row .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.student-row .sname{font-weight:600;font-size:.94rem}
.student-row .badge{padding:2px 9px;border-radius:var(--radius-sm);font-size:.74rem;font-weight:600;flex-shrink:0}
.student-row .meta{font-size:.76rem;color:var(--text-secondary);margin-top:5px}

.empty-msg,.error-msg{color:var(--text-secondary);font-size:.88rem;padding:20px 4px;text-align:center}
.error-msg{color:var(--danger)}
.loading{color:var(--text-secondary);font-size:.88rem;padding:20px 4px;text-align:center}

.tabs{display:flex;gap:8px;margin:22px 0 10px}
.tab-btn{
  flex:1;padding:9px;border-radius:var(--radius-pill);border:1.5px solid var(--border);background:var(--surface);
  color:var(--text-secondary);font-family:var(--font-body);font-weight:600;font-size:.86rem;cursor:pointer;
}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}

.fg{margin-bottom:12px}
.fg label{display:block;font-size:.8rem;color:var(--text-secondary);margin-bottom:5px;font-weight:600}
.fg input,.fg textarea{
  width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:.92rem;
}
.btn-add{
  width:100%;padding:11px;border-radius:var(--radius-pill);border:none;background:var(--accent);
  color:var(--accent-contrast);font-weight:700;font-size:.92rem;cursor:pointer;margin-top:4px;
}
.btn-add:disabled{opacity:.5}
.lit-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.lit-row .lname{font-weight:600;font-size:.9rem}
.lit-row .lsub{font-size:.78rem;color:var(--text-secondary)}
.lit-row .del-btn{background:none;border:none;color:var(--danger);font-size:.8rem;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greeting">
      <div class="hello" id="helloLine">Доброе утро</div>
      <div class="name" id="nameLine">Владелец</div>
    </div>
    <div class="header-icon" id="refreshBtn">↻</div>
  </header>

  <div class="hero">
    <div>
      <div class="label">📊 За 7 дней</div>
      <h2>Активность учеников</h2>
    </div>
    <div class="ring-wrap">
      <svg width="92" height="92" viewBox="0 0 92 92">
        <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/>
        <circle id="ringProgress" cx="46" cy="46" r="40" fill="none" stroke="#fff" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
      </svg>
      <div class="ring-num"><b id="ringPct">–</b><span id="ringSub">загрузка</span></div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="icon">👥</div><div class="num" id="statTotal">–</div><div class="cap">Всего учеников</div></div>
    <div class="stat-card"><div class="icon">🏫</div><div class="num" id="statGroups">–</div><div class="cap">Групп</div></div>
    <div class="stat-card"><div class="icon">💳</div><div class="num" id="statPaid">–</div><div class="cap">Оплатили</div></div>
    <div class="stat-card"><div class="icon">⏳</div><div class="num" id="statTrial">–</div><div class="cap">На пробном</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabStudents">Ученики</button>
    <button class="tab-btn" id="tabTeachers">Преподаватели</button>
  </div>
  <div id="studentsList"><div class="loading">Загрузка...</div></div>

  <div class="section-title">📚 Литература</div>
  <div class="fg"><label>Предмет</label><input id="litSubject" placeholder="Физика"></div>
  <div class="fg"><label>Название книги</label><input id="litTitle" placeholder="Курс общей физики"></div>
  <div class="fg"><label>PDF-файл</label><input type="file" id="litFile" accept="application/pdf"></div>
  <button class="btn-add" id="litAddBtn">Загрузить книгу</button>
  <div id="litList" style="margin-top:14px"></div>
</div>

<script>

(function(){
  "use strict";
  const SUPABASE_URL = "https://wsrrqwvemfliwzsqlkvg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...mcnzJ6Fh5eTCJSYXQ6rMkBHAbL5JPIC1UId1DlRfuDY";
  const sb = (typeof supabase !== "undefined") ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function fmtDate(iso){
    var d=new Date(iso);
    return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
  }
  function fmtLastSeen(iso, now){
    if(!iso) return "ни разу не заходил(а)";
    var d=new Date(iso);
    var diffH=(now-d)/3600000;
    if(diffH<1) return "только что";
    if(diffH<24) return "сегодня";
    if(diffH<48) return "вчера";
    return fmtDate(iso);
  }
  function greetingWord(){
    var h=new Date().getHours();
    if(h<6) return "Доброй ночи";
    if(h<12) return "Доброе утро";
    if(h<18) return "Добрый день";
    return "Добрый вечер";
  }

  var myGroupIdForUpload=null; // literature needs SOME group_id - we use the owner's own, or the first group
  var allGroups=[];

  async function main(){
    document.getElementById("helloLine").textContent=greetingWord();
    if(!sb){
      document.getElementById("studentsList").innerHTML='<div class="error-msg">Supabase не подключён</div>';
      return;
    }
    var sess=await sb.auth.getSession();
    var session=sess.data.session;
    if(!session){
      document.getElementById("studentsList").innerHTML='<div class="error-msg">Нет входа. Войди через основной сайт (auth.html) в этом же браузере, затем обнови страницу.</div>';
      return;
    }
    var myProf=await sb.from("profiles").select("full_name,is_owner,group_id").eq("id",session.user.id).maybeSingle();
    if(!myProf.data || !myProf.data.is_owner){
      document.getElementById("studentsList").innerHTML='<div class="error-msg">Этот раздел только для владельца.</div>';
      return;
    }
    document.getElementById("nameLine").textContent=myProf.data.full_name || "Владелец";
    myGroupIdForUpload=myProf.data.group_id;

    var groupsRes=await sb.from("groups").select("id,name");
    allGroups=groupsRes.data||[];
    if(!myGroupIdForUpload && allGroups.length) myGroupIdForUpload=allGroups[0].id;

    await loadStudents(groupsRes.data||[]);
    await loadLiterature();
  }

  async function loadStudents(groupsData){
    var profRes=await sb.from("profiles").select("id,full_name,group_id,trial_until,paid_until,last_seen_at,referred_by,is_owner");
    if(profRes.error){
      document.getElementById("studentsList").innerHTML='<div class="error-msg">Ошибка: '+esc(profRes.error.message)+'</div>';
      return;
    }
    var rows=(profRes.data||[]).filter(function(r){ return !r.is_owner; });
    var now=new Date();
    var weekAgo=new Date(now.getTime()-7*86400000);

    var activeThisWeek=rows.filter(function(r){ return r.last_seen_at && new Date(r.last_seen_at)>weekAgo; }).length;
    var pct=rows.length ? Math.round(100*activeThisWeek/rows.length) : 0;
    var circumference=251.2;
    document.getElementById("ringProgress").setAttribute("stroke-dashoffset", String(circumference*(1-pct/100)));
    document.getElementById("ringPct").textContent=pct+"%";
    document.getElementById("ringSub").textContent=activeThisWeek+" из "+rows.length;

    document.getElementById("statTotal").textContent=rows.length;
    document.getElementById("statGroups").textContent=groupsData.length;
    var paidCount=rows.filter(function(r){ return r.paid_until && new Date(r.paid_until)>now; }).length;
    var trialCount=rows.filter(function(r){
      var paid=r.paid_until && new Date(r.paid_until)>now;
      var trial=r.trial_until && new Date(r.trial_until)>now;
      return trial && !paid;
    }).length;
    document.getElementById("statPaid").textContent=paidCount;
    document.getElementById("statTrial").textContent=trialCount;

    var refCounts={};
    rows.forEach(function(r){ if(r.referred_by) refCounts[r.referred_by]=(refCounts[r.referred_by]||0)+1; });
    var groupNameById={};
    (groupsData||[]).forEach(function(g){ groupNameById[g.id]=g.name; });

    rows.sort(function(a,b){ return (b.last_seen_at||"").localeCompare(a.last_seen_at||""); });

    var listEl=document.getElementById("studentsList");
    if(!rows.length){
      listEl.innerHTML='<div class="empty-msg">Пока никто не зарегистрировался</div>';
      return;
    }
    var h="";
    rows.forEach(function(r){
      var paid=r.paid_until && new Date(r.paid_until)>now;
      var trial=r.trial_until && new Date(r.trial_until)>now;
      var badge = paid ? {label:"Оплачено до "+fmtDate(r.paid_until), bg:"#1E9E5A17", fg:"#1E9E5A"}
                : trial ? {label:"Пробный до "+fmtDate(r.trial_until), bg:"#C9922B17", fg:"#C9922B"}
                : {label:"Не оплачено", bg:"#C43A3F17", fg:"#C43A3F"};
      h+='<div class="student-row"><div class="top">';
      h+='<span class="sname">'+esc(r.full_name||"Без имени")+'</span>';
      h+='<span class="badge" style="background:'+badge.bg+';color:'+badge.fg+'">'+badge.label+'</span>';
      h+='</div><div class="meta">'+esc(groupNameById[r.group_id]||"группа?")+' · Был(а): '+fmtLastSeen(r.last_seen_at, now)+' · Привёл(а): '+(refCounts[r.id]||0)+'</div></div>';
    });
    listEl.innerHTML=h;
  }

  async function loadTeachers(){
    var listEl=document.getElementById("studentsList");
    listEl.innerHTML='<div class="loading">Загрузка...</div>';
    var res=await sb.from("teacher_profiles").select("id,full_name,last_seen_at,created_at");
    if(res.error){ listEl.innerHTML='<div class="error-msg">Ошибка: '+esc(res.error.message)+'</div>'; return; }
    var rows=res.data||[];
    if(!rows.length){ listEl.innerHTML='<div class="empty-msg">Пока никто из преподавателей не зарегистрировался</div>'; return; }
    var now=new Date();
    rows.sort(function(a,b){ return (b.last_seen_at||"").localeCompare(a.last_seen_at||""); });
    var h="";
    rows.forEach(function(r){
      h+='<div class="student-row"><div class="top">';
      h+='<span class="sname">'+esc(r.full_name)+'</span>';
      h+='<span class="badge" style="background:var(--accent-soft);color:var(--accent)">Учитель</span>';
      h+='</div><div class="meta">Был(а): '+fmtLastSeen(r.last_seen_at, now)+' · Зарегистрирован(а): '+fmtDate(r.created_at)+'</div></div>';
    });
    listEl.innerHTML=h;
  }

  async function loadLiterature(){
    var listEl=document.getElementById("litList");
    if(!allGroups.length){ listEl.innerHTML=''; return; }
    var groupIds=allGroups.map(function(g){return g.id;});
    var res=await sb.from("literature_books").select("id,subject,title,storage_path,group_id").in("group_id",groupIds);
    if(res.error){ listEl.innerHTML='<div class="error-msg">Ошибка: '+esc(res.error.message)+'</div>'; return; }
    var rows=res.data||[];
    if(!rows.length){ listEl.innerHTML='<div class="empty-msg">Пока ничего не загружено</div>'; return; }
    var h="";
    rows.forEach(function(b){
      h+='<div class="lit-row"><div><div class="lname">'+esc(b.title)+'</div><div class="lsub">'+esc(b.subject)+'</div></div>';
      h+='<button class="del-btn" data-id="'+b.id+'" data-path="'+esc(b.storage_path)+'">Удалить</button></div>';
    });
    listEl.innerHTML=h;
    listEl.querySelectorAll(".del-btn").forEach(function(btn){
      btn.onclick=async function(){
        await sb.storage.from("literature").remove([this.getAttribute("data-path")]);
        await sb.from("literature_books").delete().eq("id",this.getAttribute("data-id"));
        loadLiterature();
      };
    });
  }

  document.getElementById("litAddBtn").onclick=async function(){
    var subject=document.getElementById("litSubject").value.trim();
    var title=document.getElementById("litTitle").value.trim();
    var file=document.getElementById("litFile").files[0];
    if(!subject||!title||!file){ alert("Заполни предмет, название и выбери файл"); return; }
    if(!myGroupIdForUpload){ alert("Не найдена группа для загрузки"); return; }
    var btn=this;
    btn.disabled=true; btn.textContent="Загружаем...";
    try{
      var safeName=title.replace(/[^a-zA-Zа-яА-Я0-9_.-]/g,"_").slice(0,60)+".pdf";
      var path=myGroupIdForUpload+"/"+Date.now()+"-"+safeName;
      var up=await sb.storage.from("literature").upload(path, file, {contentType:"application/pdf"});
      if(up.error){ alert("Ошибка загрузки: "+up.error.message); return; }
      var ins=await sb.from("literature_books").insert({group_id:myGroupIdForUpload, subject:subject, title:title, storage_path:path, file_size:file.size});
      if(ins.error){ alert("Файл загружен, но не сохранился в списке: "+ins.error.message); return; }
      document.getElementById("litSubject").value="";
      document.getElementById("litTitle").value="";
      document.getElementById("litFile").value="";
      await loadLiterature();
    } finally {
      btn.disabled=false; btn.textContent="Загрузить книгу";
    }
  };

  document.getElementById("tabStudents").onclick=function(){
    document.getElementById("tabStudents").classList.add("active");
    document.getElementById("tabTeachers").classList.remove("active");
    loadStudents(allGroups);
  };
  document.getElementById("tabTeachers").onclick=function(){
    document.getElementById("tabTeachers").classList.add("active");
    document.getElementById("tabStudents").classList.remove("active");
    loadTeachers();
  };

  document.getElementById("refreshBtn").onclick=function(){ location.reload(); };
  main();
})();

</script>
</body>
</html>
