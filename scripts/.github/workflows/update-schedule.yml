name: Update schedule

on:
  schedule:
    # 03:00 UTC = 06:00 MSK (Novosibirsk is UTC+7, so ~10:00 local).
    # Adjust the hour if you want it to run at a different local time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run scraper
        env:
          SUPABASE_URL: "https://wsrrqwvemfliwzsqlkvg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIMETABLE_GROUP_NAME: "128"
        run: node scripts/scrape-schedule.js

      - name: Upload debug page on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug-page.html
          retention-days: 7
